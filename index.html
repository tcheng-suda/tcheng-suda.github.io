---
layout: default
---

<div class="home">
  <h1 style="text-align:center"> <b>Welcome to Cheng Group at Soochow University (SCU)</b></h1>
  <img src="/images/oaao-2026.png" alt="cover" style="width:100%; height:400px; object-fit:cover; object-position:center;">
  <br />
  <br />
  <h1 style="text-align:center"><b>Recent Stories</b></h1>
  <ul class="post-list">
    {% for post in site.posts limit:5 %}
      <li>
        <b><span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
        <h4>
        <b><a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a>
        </h4>
      </li>
    {% endfor %}
  </ul>


</div>
