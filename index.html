---
layout: default
---

<div class="home">
  <img class="cover-light" src="/images/covers/oaao.webp" alt="cover" width="1672" height="941" fetchpriority="high" decoding="async">
  <img class="cover-dark" src="/images/covers/oaao-d2.webp" alt="cover" width="1672" height="941" fetchpriority="high" decoding="async">
  <br />
  <br />
  <h1 style="text-align:center"> <b>Welcome to Cheng Group @Soochow University</b></h1>
  <ul class="post-list">
    {% for post in site.posts limit:6 %}
      <li>
        <b><span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
        <h4>
        <b><a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a>
        </h4>
      </li>
    {% endfor %}
  </ul>


</div>
