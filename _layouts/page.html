---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{% if page.title_zh %}<span class="en-only">{{ page.title }}</span><span class="zh-only">{{ page.title_zh }}</span>{% else %}{{ page.title }}{% endif %}</h1>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>
