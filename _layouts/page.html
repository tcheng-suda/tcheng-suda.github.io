---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{% if page.title_zh %}<span class="language-pair"><span class="en-only" lang="en">{{ page.title }}</span><span class="zh-only" lang="zh-CN">{{ page.title_zh }}</span></span>{% else %}{{ page.title }}{% endif %}</h1>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>
